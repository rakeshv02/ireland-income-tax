<script type="text/babel">
//<![CDATA[
const { useState } = React;

function calcIreland(gross, status) {
  // PAYE 2025
  const cutoff = status === 'married' ? 51000 : 42000;
  const taxable = Math.max(0, gross);
  const atStandard = Math.min(taxable, cutoff);
  const atHigher = Math.max(0, taxable - cutoff);
  let paye = atStandard * 0.20 + atHigher * 0.40;

  // Tax credits 2025
  const personalCredit = status === 'married' ? 3750 : 1875;
  const payeCredit = 1875;
  const totalCredits = personalCredit + payeCredit;
  paye = Math.max(0, paye - totalCredits);

  // USC 2025
  let usc = 0;
  if (gross <= 13000) {
    usc = 0;
  } else {
    const bands = [
      { limit: 12012, rate: 0.005 },
      { limit: 25760, rate: 0.02 },
      { limit: 70044, rate: 0.04 },
      { limit: Infinity, rate: 0.08 },
    ];
    let remaining = gross;
    let prev = 0;
    for (const b of bands) {
      const slice = Math.min(remaining, b.limit - prev);
      usc += slice * b.rate;
      remaining -= slice;
      prev = b.limit;
      if (remaining <= 0) break;
    }
  }

  // PRSI 2025 — 4.1% employee
  const prsi = gross >= 352 * 52 ? gross * 0.041 : 0;

  const totalDeductions = paye + usc + prsi;
  const takeHome = gross - totalDeductions;
  return { paye, usc, prsi, totalDeductions, takeHome };
}

function fmt(n) { return '€' + Math.round(n).toLocaleString('en-IE'); }
function pct(n, gross) { return gross > 0 ? (n / gross * 100).toFixed(1) + '%' : '0%'; }

function Row({ label, value, gross, highlight }) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #f0f0f0'}}>
      <span style={{fontSize:14,color: highlight ? '#1a1a2e' : '#6b7280',fontWeight: highlight ? 700 : 400}}>{label}</span>
      <div style={{textAlign:'right'}}>
        <span style={{fontSize:15,fontWeight:700,color: highlight ? '#16a34a' : '#1a1a2e'}}>{fmt(value)}</span>
        <span style={{fontSize:12,color:'#9ca3af',marginLeft:8}}>{pct(value, gross)}</span>
      </div>
    </div>
  );
}

function App() {
  const [gross, setGross] = useState(55000);
  const [status, setStatus] = useState('single');

  const r = calcIreland(Number(gross) || 0, status);
  const g = Number(gross) || 0;

  return (
    <div style={{maxWidth:520,margin:'0 auto',padding:'0 0 40px'}}>
      {/* Nav */}
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>

      {/* Hero */}
      <div style={{background:'linear-gradient(135deg,#16a34a,#15803d)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🇮🇪</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Ireland Income Tax Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>PAYE · USC · PRSI — 2025 tax year</p>
      </div>

      <div style={{padding:'20px'}}>
        {/* Inputs */}
        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Annual Gross Salary</label>
          <div style={{position:'relative'}}>
            <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280',fontWeight:700}}>€</span>
            <input type="number" value={gross} onChange={e=>setGross(e.target.value)}
              style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box',outline:'none'}} />
          </div>

          <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',margin:'14px 0 6px'}}>Status</label>
          <div style={{display:'flex',gap:8}}>
            {[['single','Single'],['married','Married']].map(([v,l])=>(
              <button key={v} onClick={()=>setStatus(v)}
                style={{flex:1,padding:'9px',borderRadius:10,border:`2px solid ${status===v?'#16a34a':'#e5e7eb'}`,background:status===v?'#16a34a':'#fff',color:status===v?'#fff':'#374151',fontWeight:600,fontSize:14,cursor:'pointer'}}>
                {l}
              </button>
            ))}
          </div>
        </div>

        {/* Results */}
        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#6b7280',marginBottom:4,textTransform:'uppercase',letterSpacing:0.5}}>Take-Home Pay</div>
          <div style={{fontSize:36,fontWeight:900,color:'#16a34a',marginBottom:4}}>{fmt(r.takeHome)}</div>
          <div style={{fontSize:13,color:'#9ca3af'}}>per year &nbsp;·&nbsp; {fmt(r.takeHome/12)} / month &nbsp;·&nbsp; {fmt(r.takeHome/52)} / week</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#374151',marginBottom:8}}>Breakdown</div>
          <Row label="Gross Salary" value={g} gross={g} />
          <Row label="PAYE Income Tax" value={r.paye} gross={g} />
          <Row label="Universal Social Charge (USC)" value={r.usc} gross={g} />
          <Row label="PRSI (4.1%)" value={r.prsi} gross={g} />
          <Row label="Total Deductions" value={r.totalDeductions} gross={g} />
          <Row label="Net Take-Home" value={r.takeHome} gross={g} highlight />
        </div>

        {/* Info */}
        <div style={{background:'#f0fdf4',borderRadius:12,padding:'16px',marginTop:16,fontSize:13,color:'#15803d',lineHeight:1.6}}>
          <strong>2025 rates:</strong> PAYE standard rate 20% (cut-off €42,000 single / €51,000 married), higher rate 40%. USC: 0.5% / 2% / 4% / 8%. PRSI employee rate 4.1% (from Oct 2024). Personal tax credit €1,875 + PAYE credit €1,875.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
